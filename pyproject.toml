[project]
name = "moz1-catch"
version = "0.1.0"
description = "Hardware deployment bridge for the MozBoxer one-shot box catching stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tomli>=2.0 ; python_version < '3.11'",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "moz1_catch"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["test"]
