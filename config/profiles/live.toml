# Live profile: real UDP mocap + ROS2 cartesian sink.
#
# Catch-quality gates relaxed for live experiments (2026-09-30; base keeps the
# frozen-study values so the CSV replay regression stays pinned):
#   - max_height_error 0.28 -> 0.40 m: contact band widens from [0.92, 1.48]
#     to [0.80, 1.60] around the 1.20 m wait-palm height.  The 2026-09-30
#     throws rejected as "too low" landed at 0.85-0.91 m; 0.73 stays out.
#   - max_roll_rad 45 -> 65 deg and max_roll_speed 1.5 -> 2.0 rad/s: roll about
#     the grip axis keeps the gripped faces facing the palms, so extra roll
#     costs catch quality, not safety.  Catches the 48-56 deg / 88 deg/s
#     near-misses; the 106 deg / 155 deg/s wild throw still rejects.
# Tilt (35 deg) and tilt-axis spin (0.8 rad/s) stay strict: those rotate the
# gripped faces away from the palms.

[runtime]
source = "udp"
sink = "ros2"

[planning.overrides]
max_height_error = 0.40
max_roll_rad = 1.1345       # 65 deg (was 0.7854 / 45 deg)
max_roll_speed = 2.0        # rad/s (was 1.5 / 86 deg/s)
